[package]
name = "puente-desktop"
version.workspace = true
edition.workspace = true

[[bin]]
name = "puente"
path = "src/main.rs"

[dependencies]
puente-core.workspace = true
puente-ui.workspace = true
arboard = { version = "3", features = ["wayland-data-control"] }
cpal = "0.18"
dirs = "6"
eframe = { workspace = true, features = ["wayland", "x11"] }
notify-rust = "4"
openh264 = "0.9"
rfd = "0.18"
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
