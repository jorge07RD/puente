[workspace]
resolver = "3"
members = [
    "crates/puente-core",
    "crates/puente-ui",
    "crates/puente-desktop",
    "crates/puente-android",
]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
puente-core = { path = "crates/puente-core" }
puente-ui = { path = "crates/puente-ui" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
lto = "thin"
strip = true
